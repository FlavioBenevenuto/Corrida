<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Corrida Top-Down - Protótipo Completo (corrigido)</title>
<style>
  html,body{height:100%;margin:0;background:#111;color:#fff;font-family:Arial,Helvetica,sans-serif}
  #game-container{width:100%;height:100vh;overflow:hidden;display:block;position:relative}
  .overlay{position:absolute;left:12px;top:12px;z-index:50;background:rgba(0,0,0,0.45);padding:8px;border-radius:6px}
  .overlay.right{left:auto;right:12px;text-align:right}
  #message{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);z-index:60;background:rgba(0,0,0,0.6);padding:14px;border-radius:8px;display:none}
  a.small{color:#8ad;text-decoration:none}
</style>
<script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
</head>
<body>
<div id="game-container"></div>
<div id="message"></div>
<script>
/*
  Protótipo completo de corrida top-down (single-file)
  (versão corrigida)
*/
const GAME_WIDTH = Math.min(1100, window.innerWidth);
const GAME_HEIGHT = Math.min(700, window.innerHeight);

const config = {
  type: Phaser.AUTO,
  parent: 'game-container',
  width: GAME_WIDTH,
  height: GAME_HEIGHT,
  backgroundColor: 0x0b0b0b,
  physics: { default:'arcade', arcade:{ debug:false } },
  scene: { preload, create, update }
};
const game = new Phaser.Game(config);

let player, cursors, keys;
let bots = [];
let checkpoints = [];
let startTime=0;
let timerText, lapText, posText, messageDiv;
let boostPads = [];
let outerShape = null, innerShape = null; // tornar globais
let globalEmitter = null;

function preload(){ /* sem assets externos */ }

function create(){
  const scene = this;
  messageDiv = document.getElementById('message');

  // generate textures
  const g = this.make.graphics({x:0,y:0,add:false});
  g.fillStyle(0xff4d4d,1);
  g.beginPath(); g.moveTo(16,0); g.lineTo(32,48); g.lineTo(0,48); g.closePath(); g.fillPath();
  g.generateTexture('car',32,48); g.clear();
  g.fillStyle(0x4da6ff,1); g.beginPath(); g.moveTo(16,0); g.lineTo(32,48); g.lineTo(0,48); g.closePath(); g.fillPath();
  g.generateTexture('bot',32,48); g.clear();
  g.fillStyle(0xffdd57,1); g.fillCircle(10,10,8); g.generateTexture('coin',20,20); g.clear();
  g.fillStyle(0x7d7d7d,1); g.fillCircle(12,12,10); g.generateTexture('rock',24,24); g.clear();
  g.fillStyle(0x38b000,1); g.fillRoundedRect(0,0,60,20,6); g.generateTexture('boost',60,20); g.clear();

  // create track background
  const bg = this.add.graphics();
  const pad = 40;
  const w = GAME_WIDTH; const h = GAME_HEIGHT;
  bg.fillStyle(0x2b2b2b,1);
  bg.fillRect(0,0,w,h);

  // outer and inner shapes (guardar nas variáveis globais)
  outerShape = new Phaser.Geom.RoundRectangle(pad,pad,w-2*pad,h-2*pad,80);
  innerShape = new Phaser.Geom.RoundRectangle(pad+140,pad+80,w-2*pad-280,h-2*pad-160,60);

  bg.fillStyle(0x1f2933,1); bg.fillRect(0,0,w,h);
  bg.fillStyle(0x0f3b1f,1); bg.fillRoundedRect(0,0,w,h,0);
  bg.fillStyle(0x2e2e2e,1); bg.fillRoundedRect(outerShape.x,outerShape.y,outerShape.width,outerShape.height,80);
  bg.fillStyle(0x14321b,1); bg.fillRoundedRect(innerShape.x,innerShape.y,innerShape.width,innerShape.height,60);
  drawCenterLine(bg, outerShape, innerShape);

  // static obstacles
  const rocksGroup = this.physics.add.staticGroup();
  placeRock(rocksGroup, w*0.3, h*0.25);
  placeRock(rocksGroup, w*0.7, h*0.75);
  placeRock(rocksGroup, w*0.5, h*0.5-80);

  // boost pads
  const boosts = this.physics.add.staticGroup();
  createBoost(boosts, w*0.5 - 150, h*0.5+150);
  createBoost(boosts, w*0.5 + 120, h*0.5-150);

  // checkpoints
  checkpoints = [];
  const cps = [
    {x: w/2, y: pad+10},
    {x: w-pad-10, y: h/2},
    {x: w/2, y: h-pad-10},
    {x: pad+10, y: h/2}
  ];
  cps.forEach((c,i)=>{
    const rect = this.add.rectangle(c.x,c.y, innerShape.width*0.2, innerShape.height*0.05, 0xffffff, 0.001);
    this.physics.add.existing(rect, true);
    rect.cpIndex = i;
    checkpoints.push(rect);
  });

  // player
  player = this.physics.add.sprite(w/2, h/2 - innerShape.height/2 - 40, 'car');
  player.setOrigin(0.5,0.5);
  player.setDepth(5);
  player.body.setSize(20,36);
  player.maxSpeed = 400;
  player.acc = 220;
  player.turnSpeed = 220;
  player.drift = 0.96;
  player.laps = 0;
  player.nextCp = 0;

  // bots
  for(let i=0;i<3;i++){
    const b = this.physics.add.sprite(player.x + (i+1)*40, player.y + (i+1)*30, 'bot');
    b.wayIndex = Math.floor((i/3)*24);
    b.maxSpeed = 300 - i*30;
    b.acc = 160;
    bots.push(b);
  }

  // collisions
  this.physics.add.collider(player, rocksGroup, hitObstacle, null, this);
  this.physics.add.collider(bots, rocksGroup);
  this.physics.add.overlap(player, boosts, (p, pad)=>{ triggerBoost(p); }, null, this);

  // camera
  this.cameras.main.setBounds(0,0,w,h);
  this.cameras.main.startFollow(player,true,0.08,0.08);
  this.cameras.main.setZoom(1.0);

  // HUD
  timerText = this.add.text(12,12,'Tempo: 0.00',{font:'18px Arial',fill:'#fff'}).setScrollFactor(0).setDepth(60);
  lapText = this.add.text(12,36,'Volta: 0/3',{font:'18px Arial',fill:'#fff'}).setScrollFactor(0).setDepth(60);
  posText = this.add.text(GAME_WIDTH-12,12,'Pos: 1/4',{font:'18px Arial',fill:'#fff'}).setOrigin(1,0).setScrollFactor(0).setDepth(60);

  // controls
  cursors = this.input.keyboard.createCursorKeys();
  keys = this.input.keyboard.addKeys({W:Phaser.Input.Keyboard.KeyCodes.W, A:Phaser.Input.Keyboard.KeyCodes.A, S:Phaser.Input.Keyboard.KeyCodes.S, D:Phaser.Input.Keyboard.KeyCodes.D, R:Phaser.Input.Keyboard.KeyCodes.R});

  // start time
  startTime = performance.now();
  scene.time.addEvent({ delay: 100, loop:true, callback: updateTimer, callbackScope: scene });

  // particles & emitter (guardar global para usar em outras funções)
  const particles = this.add.particles('coin');
  globalEmitter = particles.createEmitter({ speed: {min:20,max:120}, lifespan:300, quantity:6, scale:{start:0.5,end:0.1}, on:false });

  // audio helper
  window.playBeep = function(freq,dur,vol=0.05){
    try{
      const ctx = window.__audioCtx || (window.__audioCtx = new (window.AudioContext || window.webkitAudioContext)());
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type='sine'; o.frequency.value=freq;
      g.gain.value = vol;
      o.connect(g); g.connect(ctx.destination);
      o.start(); g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur/1000);
      setTimeout(()=>{ o.stop(); }, dur+20);
    }catch(e){}
  };

  showMessage('Use WASD/Setas: acelerar, frear e virar. Colete moedas, use boost (verde). R para reiniciar.');
}

function update(time,dt){
  const scene = this;
  if (!player) return;
  const up = cursors.up.isDown || keys.W.isDown;
  const down = cursors.down.isDown || keys.S.isDown;
  const left = cursors.left.isDown || keys.A.isDown;
  const right = cursors.right.isDown || keys.D.isDown;

  const rad = Phaser.Math.DegToRad(player.angle-90);
  const fx = Math.cos(rad), fy = Math.sin(rad);

  if (up){
    player.body.velocity.x += fx * player.acc * (dt/1000);
    player.body.velocity.y += fy * player.acc * (dt/1000);
    window.playBeep(400,30,0.01);
  }
  if (down){
    player.body.velocity.x += -fx * player.acc * 0.6 * (dt/1000);
    player.body.velocity.y += -fy * player.acc * 0.6 * (dt/1000);
  }

  const speed = Math.sqrt(player.body.velocity.x*player.body.velocity.x + player.body.velocity.y*player.body.velocity.y);
  const turnFactor = Phaser.Math.Clamp(speed/ player.maxSpeed, 0, 1);
  if (left) player.angle -= player.turnSpeed * (dt/1000) * (0.5 + 0.5*turnFactor);
  if (right) player.angle += player.turnSpeed * (dt/1000) * (0.5 + 0.5*turnFactor);

  player.body.velocity.x *= player.drift;
  player.body.velocity.y *= player.drift;

  // update bots (sem chamar generateWaypoints() sem args)
  updateBots(this, dt);

  // checkpoints
  checkpoints.forEach(cp=>{
    const d = Phaser.Math.Distance.Between(player.x,player.y, cp.x, cp.y);
    if (d < 80){
      if (player.nextCp === cp.cpIndex){
        player.nextCp = (player.nextCp+1) % checkpoints.length;
        playBeep(800,50,0.02);
        if (player.nextCp === 0){
          player.laps += 1;
          lapText.setText('Volta: '+player.laps+'/3');
          if (player.laps >= 3){
            endRace(this);
          }
        }
      }
    }
  });

  updatePositionText();

  if (Phaser.Input.Keyboard.JustDown(keys.R)){
    this.scene.restart();
  }
}

function updateTimer(){
  const t = (performance.now() - startTime)/1000;
  if (timerText) timerText.setText('Tempo: '+t.toFixed(2)+'s');
}

function endRace(scene){
  const total = (performance.now()-startTime)/1000;
  showMessage('Fim de corrida! Tempo: '+total.toFixed(2)+'s — Pressione R para reiniciar');
  playBeep(200,300,0.04);
  scene.scene.pause();
}

function showMessage(text){
  const div = document.getElementById('message');
  div.style.display='block';
  div.innerHTML = '<div style="font-size:16px;line-height:1.4;text-align:center">'+text+'</div>';
  setTimeout(()=>{ div.style.display='none'; }, 4500);
}

function drawCenterLine(g, outer, inner){
  g.lineStyle(2,0xffffff,0.4);
  const steps = 160;
  for(let i=0;i<steps;i++){
    const t = i/steps;
    const ang = t*Math.PI*2;
    const rx = (outer.width/2 - 140/2) * Math.cos(ang);
    const ry = (outer.height/2 - 80/2) * Math.sin(ang);
    const x = outer.x + outer.width/2 + rx;
    const y = outer.y + outer.height/2 + ry;
    if (i%6<3) g.fillStyle(0xffffff,0.2), g.fillCircle(x,y,1.5);
  }
}

function placeRock(group,x,y){
  const r = group.create(x,y,'rock');
  r.setScale(1.0);
  r.refreshBody();
}

function createBoost(group,x,y){
  const b = group.create(x,y,'boost');
  b.setScale(1);
  b.refreshBody();
  boostPads.push(b);
}

function triggerBoost(p){
  const rad = Phaser.Math.DegToRad(p.angle-90);
  const fx = Math.cos(rad), fy = Math.sin(rad);
  p.body.velocity.x += fx * 700;
  p.body.velocity.y += fy * 700;
  window.playBeep(1200,80,0.02);
  if (globalEmitter) globalEmitter.emitParticleAt(p.x, p.y, 10);
}

function generateWaypoints(outer, inner){
  const pts = [];
  const cx = outer.x + outer.width/2;
  const cy = outer.y + outer.height/2;
  const steps = 24;
  for(let i=0;i<steps;i++){
    const ang = (i/steps) * Math.PI*2;
    const x = cx + Math.cos(ang) * (inner.width/2 + 80) * 0.95;
    const y = cy + Math.sin(ang) * (inner.height/2 + 40) * 0.95;
    pts.push({x,y});
  }
  return pts;
}

function updateBots(scene, dt){
  // bots follow implicit circular waypoints using their wayIndex
  bots.forEach((b,bi)=>{
    if (!b.wayIndex && b.wayIndex !== 0) b.wayIndex = 0;
    const target = getWaypointForBot(b);
    const angTo = Phaser.Math.RadToDeg(Phaser.Math.Angle.Between(b.x,b.y,target.x,target.y)) + 90;
    let diff = Phaser.Math.Angle.WrapDegrees(angTo - b.angle);
    b.angle += diff * 0.08;
    const rad = Phaser.Math.DegToRad(b.angle-90);
    b.body.velocity.x += Math.cos(rad) * b.acc * (dt/1000);
    b.body.velocity.y += Math.sin(rad) * b.acc * (dt/1000);
    b.body.velocity.x *= 0.98; b.body.velocity.y *= 0.98;
    const sp = Math.sqrt(b.body.velocity.x*b.body.velocity.x + b.body.velocity.y*b.body.velocity.y);
    if (sp > b.maxSpeed){ b.body.velocity.x *= 0.96; b.body.velocity.y *= 0.96; }
    if (Phaser.Math.Distance.Between(b.x,b.y,target.x,target.y) < 40){
      b.wayIndex = (b.wayIndex+1) % 24;
    }
  });
}

function getWaypointForBot(b){
  const cx = outerShape.x + outerShape.width/2;
  const cy = outerShape.y + outerShape.height/2;
  const r = Math.min(GAME_WIDTH, GAME_HEIGHT)/2 - 160;
  const i = b.wayIndex || 0;
  const ang = (i/24)*Math.PI*2;
  const x = cx + Math.cos(ang) * (r * 0.8);
  const y = cy + Math.sin(ang) * (r * 0.5);
  return {x,y};
}

function hitObstacle(p, rock){
  p.body.velocity.x *= -0.45;
  p.body.velocity.y *= -0.45;
  playBeep(160,180,0.03);
  if (globalEmitter) globalEmitter.emitParticleAt(p.x,p.y,12);
}

function updatePositionText(){
  if (!player) return;
  const arr = [{id:'player',x:player.x,y:player.y}].concat(bots.map((b,i)=>({id:'bot'+i,x:b.x,y:b.y})));
  arr.sort((a,b)=>b.y - a.y);
  const pos = arr.findIndex(it=>it.id==='player') + 1;
  if (posText) posText.setText('Pos: '+pos+'/'+(1+bots.length));
}
</script>
</body>
</html>
