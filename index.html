<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jogo de Carro - Navegador</title>
  <style>
    body { margin: 0; background: #1b1b1b; overflow: hidden; font-family: Arial, sans-serif; }
    #game-container { width: 100vw; height: 100vh; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.js"></script>
</head>
<body>
  <div id="game-container"></div>
  <script>
    const config = {
      type: Phaser.AUTO,
      width: window.innerWidth,
      height: window.innerHeight,
      parent: 'game-container',
      physics: {
        default: 'arcade',
        arcade: { gravity: { y: 0 }, debug: false }
      },
      scene: { preload, create, update }
    };

    let player, cursors, speed = 260;
    const game = new Phaser.Game(config);

    function preload() {}
    function create() {
      player = this.add.rectangle(200, 200, 40, 70, 0xff0000);
      this.physics.add.existing(player);
      player.body.setCollideWorldBounds(true);
      cursors = this.input.keyboard.createCursorKeys();
    }
    function update() {
      player.body.setVelocity(0);
      if (cursors.up.isDown) player.body.setVelocityY(-speed);
      if (cursors.down.isDown) player.body.setVelocityY(speed);
      if (cursors.left.isDown) player.body.setVelocityX(-speed);
      if (cursors.right.isDown) player.body.setVelocityX(speed);
    }
  </script>
</body>
</html>
